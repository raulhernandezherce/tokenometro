[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenometro"
version = "1.0.0"
description = "Audita cuántos tokens gasta Claude Code, cuánto costaría por API y dónde ahorrar."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Raúl Hernández Herce"}]
keywords = ["claude", "claude-code", "tokens", "cost", "anthropic"]

[project.scripts]
tokenometro = "tokenometro.auditoria:main"

[tool.setuptools]
packages = ["tokenometro"]

[tool.setuptools.package-data]
tokenometro = ["precios.json"]
